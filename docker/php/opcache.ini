; Zend OPcache is statically linked into php:8.5 — this file only configures it.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Kept on so bind-mounted sources in development are picked up immediately.
; In production `php artisan optimize` writes new files, so this only costs a stat.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.save_comments = 1
